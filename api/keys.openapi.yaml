openapi: 3.1.0
info:
  title: TextDock scoped API keys
  version: 0.8.0-beta.2
  description: Operator-managed machine credentials. Anonymous operator access remains possible only in the existing unauthenticated local mode. Scoped keys cannot administer keys or device/relay integrations.
  license: { name: MIT, identifier: MIT }
servers:
  - url: http://localhost:18257
security:
  - operatorToken: []
paths:
  /api/v1/keys:
    get:
      operationId: listAPIKeys
      summary: List key metadata, including revoked keys, without credential material
      responses:
        '200':
          description: Operator-only list
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/Key' }
        '401': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
    post:
      operationId: createAPIKey
      summary: Issue a new secret, returned once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Grant' }
      responses:
        '201':
          description: New key and one-time secret
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { $ref: '#/components/schemas/Key' }
                  token: { type: string, pattern: '^td_key_', description: Store securely; not available on subsequent reads }
        '400': { $ref: './openapi.yaml#/components/responses/Error' }
        '401': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
  /api/v1/keys/{id}:
    delete:
      operationId: revokeAPIKey
      summary: Revoke a key and close its live subscriptions
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '204': { description: 'Revoked, including an already revoked key' }
        '401': { $ref: './openapi.yaml#/components/responses/Error' }
        '403': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { $ref: './openapi.yaml#/components/responses/Error' }
  /api/v1/session:
    get:
      operationId: getAPIKeySession
      summary: Inspect the current machine credential's grant
      security:
        - apiKey: []
      responses:
        '200':
          description: Current scoped key; this is not a user-login session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Key' }
        '401': { $ref: './openapi.yaml#/components/responses/Error' }
        '404': { description: No scoped API key session for an operator credential }
components:
  securitySchemes:
    operatorToken: { type: http, scheme: bearer }
    apiKey: { type: http, scheme: bearer, description: 'td_key_ secret; permissions and project/inbox enforced on every supported API operation' }
  schemas:
    Grant:
      type: object
      required: [name, project_id, permissions, expires_at]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        project_id: { type: string, minLength: 1, maxLength: 128 }
        inbox_id: { type: string, maxLength: 128, description: Omit or leave empty to cover the entire project }
        permissions:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: { type: string, enum: ['messages:read', 'messages:write', 'messages:delete'] }
        expires_at: { type: string, format: date-time, description: Future timestamp within 365 days }
    Key:
      allOf:
        - $ref: '#/components/schemas/Grant'
        - type: object
          properties:
            id: { type: string }
            created_at: { type: string, format: date-time }
            revoked_at: { type: string, format: date-time }
