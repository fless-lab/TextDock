name: Android emulator integration

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ['internal/devicelab/**', 'internal/httpapi/devicelab*', 'internal/storage/devicelab*', 'scripts/emulator-smoke.mjs', '.github/workflows/emulator.yml']
  pull_request:
    paths: ['internal/devicelab/**', 'internal/httpapi/devicelab*', 'internal/storage/devicelab*', 'scripts/emulator-smoke.mjs', '.github/workflows/emulator.yml']

permissions:
  contents: read

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.8'
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci && make build
      - name: Enable KVM for the disposable test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-port: 5554
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -no-metrics
          script: TEXTDOCK_TEST_SERIAL=emulator-5554 node scripts/emulator-smoke.mjs
